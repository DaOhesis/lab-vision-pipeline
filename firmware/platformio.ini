; PlatformIO Project Configuration File for ESP32-CAM (AI-Thinker)
; Lab Vision Pipeline - Edge Ingestion Firmware

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Compiler & Board Flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -O2

; Partition table configuration for maximum app space
board_build.partitions = min_spiffs.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
